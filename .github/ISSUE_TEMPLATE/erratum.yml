name: Erratum
description: An error, an unclear passage, or a result that reproduces differently on your hardware.
title: "[Erratum] p."
labels: ["erratum"]
body:
  - type: markdown
    attributes:
      value: |
        Every number in the book states its conditions and every measurement names its hardware, so corrections can be specific. Please check ERRATA.md first to avoid duplicates.
  - type: input
    id: edition
    attributes:
      label: Edition
      description: On the cover and in the release name.
      placeholder: "v1.0"
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: "84"
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Chapter or section
      placeholder: "9, FlashAttention and Tiling"
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the text if you can.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: Optional.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Typo or grammar
        - Technical error
        - Unclear explanation
        - Number that does not reproduce
        - Broken reference
        - Other
    validations:
      required: true
